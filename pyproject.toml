[project]
name = "databricks-ecommerce-lakehouse"
version = "1.0.0"
description = "Incremental, governed e-commerce lakehouse on Databricks"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
builtins = ["spark", "dbutils", "display"]   # Databricks notebook globals

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"**/pipelines/*" = ["E402"]
"**/notebooks/*" = ["E402"]
